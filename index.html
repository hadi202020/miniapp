<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VPN Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#1e1e2f;
  color:white;
  font-family:sans-serif;
}

.header{
  padding:15px;
  text-align:center;
  font-size:20px;
  background:#2a2a40;
}

.content{
  padding:20px;
  min-height:70vh;
}

.card{
  background:#2a2a40;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

button{
  background:#00c853;
  border:none;
  padding:8px 15px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#2a2a40;
}

.navbar button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
}
</style>
</head>

<body>

<div class="header">🛒 فروشگاه VPN</div>

<div class="content" id="content"></div>

<div class="navbar">
  <button onclick="showPlans()">خرید پلن</button>
  <button onclick="showServices()">سرویس‌های من</button>
  <button onclick="showProfile()">حساب کاربری</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const content = document.getElementById("content");

// ------------------
// خرید
// ------------------
function buyPlan(plan){
  tg.sendData(JSON.stringify({
    action: "buy",
    plan: plan
  }));
}


// ------------------
// گرفتن سرویس‌ها
// ------------------
function showServices(){
  content.innerHTML = "<p>در حال دریافت سرویس‌ها...</p>";

  tg.sendData(JSON.stringify({
    action: "get_services"
  }));
}


// ------------------
// گرفتن پروفایل
// ------------------
function showProfile(){
  content.innerHTML = "<p>در حال دریافت اطلاعات...</p>";

  tg.sendData(JSON.stringify({
    action: "get_profile"
  }));
}


// ------------------
// دریافت پاسخ از ربات
// ------------------
tg.onEvent("mainButtonClicked", function() {
  console.log("main button clicked");
});

</script>
</body>
</html>
