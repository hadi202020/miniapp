<!DOCTYPE html>
<html dir="rtl" lang="fa"> 
<head>
<meta charset="UTF-8">
<title>VPN Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#1e1e2f;
  color:white;
  font-family:sans-serif;
  direction: rtl;          /* 👈 مهم */
  text-align: right;
}

.header{
  padding:15px;
  text-align:center;
  font-size:20px;
  background:#2a2a40;
}

.content{
  padding:20px;
  min-height:70vh;
}

.card{
  background:#2a2a40;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:right;
}

button{
  background:#00c853;
  border:none;
  padding:8px 15px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  flex-direction: row-reverse;
  background:#2a2a40;
}

.navbar button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
}
</style>
</head>

<body>

<div class="header">🛒 فروشگاه VPN</div>

<div class="content" id="content"></div>

<div class="navbar">
  <button onclick="showProfile()">حساب کاربری</button>
  <button onclick="showServices()">سرویس‌های من</button>
  <button onclick="showPlans()">خرید پلن</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const content = document.getElementById("content");

// گرفتن اطلاعات کاربر از تلگرام
const user = tg.initDataUnsafe?.user;

if (!user) {
  content.innerHTML = "<p>خطا در شناسایی کاربر ❌</p>";
}

const userId = user?.id;

        text-align: center;
        background-color: #c0c0c0;

        <div class="card"><h3>50 گیگ</h3><p>175 هزار تومان</p><button onclick="buyPlan('plan_3')">خرید</button></div>
        <div class="card"><h3>70 گیگ</h3><p>235 هزار تومان</p><button onclick="buyPlan('plan_4')">خرید</button></div>
        <div class="card"><h3>100 گیگ</h3><p>315 هزار تومان</p><button onclick="buyPlan('plan_5')">خرید</button></div>
        <div class="card"><h3>120 گیگ</h3><p>370 هزار تومان</p><button onclick="buyPlan('plan_6')">خرید</button></div>
        <div class="card"><h3>150 گیگ</h3><p>460 هزار تومان</p><button onclick="buyPlan('plan_7')">خرید</button></div>
      </div>
    </div>

    <!-- 2 ماهه -->
    <div class="plan-section">
      <h2>🔹 پلن‌های 2 ماهه 🔹</h2>
      <div class="plan-grid">
        <div class="card"><h3>30 گیگ</h3><p>135 هزار تومان</p><button onclick="buyPlan('plan_8')">خرید</button></div>

      <div class="plan-grid">
        <div class="card"><h3>40 گیگ</h3><p>170 هزار تومان</p><button onclick="buyPlan('plan_14')">خرید</button></div>
        <div class="card"><h3>90 گیگ</h3><p>310 هزار تومان</p><button onclick="buyPlan('plan_15')">خرید</button></div>
        <div class="card"><h3>120 گیگ</h3><p>410 هزار تومان</p><button onclick="buyPlan('plan_16')">خرید</button></div>

function buyPlan(plan){
  tg.sendData(JSON.stringify({
    action: "buy",
    plan: plan
  }));
}



// ------------------
// گرفتن سرویس‌ها از API
// ------------------
async function showServices(){

  content.innerHTML = "<p>در حال دریافت سرویس‌ها...</p>";

  try {
    const response = await fetch("https://yourdomain.com/api/services", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: userId
      })
    });

    const data = await response.json();

    if (data.services.length === 0) {
      content.innerHTML = "<p>هیچ سرویسی ندارید ❗</p>";
      return;
    }

    let html = "";
    data.services.forEach(service => {
      html += `
        <div class="card">
          <h3>${service.plan}</h3>
          <p>وضعیت: ${service.status}</p>
          <p>انقضا: ${service.expire_date}</p>
        </div>
      `;
    });

    content.innerHTML = html;

  } catch (error) {
    content.innerHTML = "<p>خطا در دریافت اطلاعات ❌</p>";
  }
}



// ------------------
// گرفتن اطلاعات حساب کاربری
// ------------------
async function showProfile(){

  content.innerHTML = "<p>در حال دریافت اطلاعات...</p>";

  try {
    const response = await fetch("https://yourdomain.com/api/profile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: userId
      })
    });

    const data = await response.json();

    content.innerHTML = `
      <div class="card">
        <h3>اطلاعات کاربری</h3>
        <p>نام: ${data.name}</p>
        <p>آیدی: ${data.user_id}</p>
        <p>موجودی کیف پول: ${data.wallet} تومان</p>
      </div>
    `;

  } catch (error) {
    content.innerHTML = "<p>خطا در دریافت اطلاعات ❌</p>";
  }
}

</script>
</body>
</html>
